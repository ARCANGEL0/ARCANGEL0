<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="124" viewBox="0 0 320 124" role="img" aria-label="OnionChat — download">
  <rect width="320" height="124" fill="#0D0016"/>
  <rect x="1" y="1" width="318" height="122" fill="none" stroke="#7D4698" stroke-width="2"/>
  <image x="12" y="7" width="23" height="36" href="data:image/png;base64," xlink:href="data:image/png;base64,"/>
  <text x="64" y="22" font-family="Verdana,Arial,sans-serif" font-weight="bold" font-size="14" fill="#FFFFFF">OnionChat</text>
  <text x="64" y="36" font-family="'Courier New',Courier,monospace" font-size="8" fill="#68B030">tor onion services · websockets · p2p</text>
  <rect x="10" y="44" width="300" height="1" fill="#7D4698" opacity=".45"/>
  <text x="12" y="56" font-family="'Courier New',Courier,monospace" font-size="8" fill="#CBB6E8">A decentralized Android messaging application built with</text>
  <text x="12" y="64" font-family="'Courier New',Courier,monospace" font-size="8" fill="#CBB6E8">Flutter and Dart, enabling peer-to-peer communication</text>
  <text x="12" y="72" font-family="'Courier New',Courier,monospace" font-size="8" fill="#CBB6E8">through Tor onion services and WebSockets. Implements</text>
  <text x="12" y="80" font-family="'Courier New',Courier,monospace" font-size="8" fill="#CBB6E8">encrypted message exchange and real-time communication</text>
  <text x="12" y="88" font-family="'Courier New',Courier,monospace" font-size="8" fill="#CBB6E8">over onion-routed connections without relying on a</text>
  <text x="12" y="96" font-family="'Courier New',Courier,monospace" font-size="8" fill="#CBB6E8">conventional centralized messaging server.</text>
  <text x="160" y="112" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-weight="bold" font-size="9" fill="#68B030">↓ download ↓</text>
</svg>
