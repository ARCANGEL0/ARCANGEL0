<svg xmlns="http://www.w3.org/2000/svg" width="320" height="72" viewBox="0 0 320 72" role="img" aria-label="sign the guestbook">
  <defs>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" opacity=".05"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="320" height="72" fill="#000000"/>
  <rect width="320" height="72" fill="url(#scan)"/>
  <rect x="3" y="3" width="314" height="66" fill="none" stroke="#2FB9E8" stroke-width="3"/>
  <path d="M24,21 L26.4,27.6 L33,30 L26.4,32.4 L24,39 L21.6,32.4 L15,30 L21.6,27.6 Z" fill="#FFE066" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="0 24 30" to="360 24 30" dur="7s" repeatCount="indefinite"/>
  </path>
  <path d="M296,21 L298.4,27.6 L305,30 L298.4,32.4 L296,39 L293.6,32.4 L287,30 L293.6,27.6 Z" fill="#FFE066" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="360 296 30" to="0 296 30" dur="7s" repeatCount="indefinite"/>
  </path>
  <text x="160" y="37" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-style="italic" font-size="19" letter-spacing="1" fill="#3ED7FF" stroke="#000000" stroke-width="0.5" filter="url(#glow)">SIGN THE GUESTBOOK
    <animate attributeName="fill" values="#3ED7FF;#7FDCF5;#3ED7FF" dur="2.2s" repeatCount="indefinite"/>
  </text>
  <path d="M52 8v6 M49 11h6 M263 60v6 M260 63h6" stroke="#3ED7FF" stroke-width="1.2" fill="none">
    <animate attributeName="opacity" values="0;1;0" calcMode="discrete" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <path d="M270 10v5 M267.5 12.5h5 M46 58v5 M43.5 60.5h5" stroke="#FFE066" stroke-width="1" fill="none">
    <animate attributeName="opacity" values="1;0;1" calcMode="discrete" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <text x="160" y="58" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="7.5" fill="#B9C4D4">✉ click to sign — it's free ✉
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.6;0.6;1" dur="1.4s" repeatCount="indefinite"/>
  </text>
</svg>
