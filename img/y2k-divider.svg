<svg xmlns="http://www.w3.org/2000/svg" width="900" height="18" viewBox="0 0 900 18" role="img" aria-label="animated rainbow star divider">
  <defs>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2fd6"/>
      <stop offset="0.25" stop-color="#ffd319"/>
      <stop offset="0.5" stop-color="#39ff14"/>
      <stop offset="0.75" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#3C81F3"/>
    </linearGradient>
  </defs>
  <rect x="0" y="6" width="900" height="6" rx="3" fill="url(#rainbow)" opacity="0.85"/>
  <g fill="#ffffff">
    <path d="M0,-7 L1.8,-1.8 L7,0 L1.8,1.8 L0,7 L-1.8,1.8 L-7,0 L-1.8,-1.8 Z" transform="translate(0,9)">
      <animateTransform attributeName="transform" type="translate" values="-20 9; 940 9" dur="3.4s" repeatCount="indefinite"/>
    </path>
    <path d="M0,-7 L1.8,-1.8 L7,0 L1.8,1.8 L0,7 L-1.8,1.8 L-7,0 L-1.8,-1.8 Z" transform="translate(0,9)">
      <animateTransform attributeName="transform" type="translate" values="-20 9; 940 9" dur="4.6s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="0.8s" repeatCount="indefinite"/>
    </path>
    <path d="M0,-7 L1.8,-1.8 L7,0 L1.8,1.8 L0,7 L-1.8,1.8 L-7,0 L-1.8,-1.8 Z" transform="translate(0,9)" fill="#ffd319">
      <animateTransform attributeName="transform" type="translate" values="-20 9; 940 9" dur="5.6s" begin="1.6s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
