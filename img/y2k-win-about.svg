<svg xmlns="http://www.w3.org/2000/svg" width="480" height="470" viewBox="0 0 480 470" role="img" aria-label="about.conf - Notepad window with arcxlo config, Win95 style">
  <!-- window frame -->
  <rect x="0" y="0" width="480" height="470" fill="#C0C0C0"/>
  <rect x="0" y="0" width="480" height="1" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1" height="470" fill="#FFFFFF"/>
  <rect x="0" y="469" width="480" height="1" fill="#404040"/>
  <rect x="479" y="0" width="1" height="470" fill="#404040"/>

  <!-- titlebar -->
  <rect x="1" y="1" width="478" height="18" fill="#000080"/>
  <text x="5" y="13" font-family="MS Sans Serif,Verdana,sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF">about.conf - Notepad</text>

  <rect x="426" y="3" width="16" height="14" fill="#C0C0C0"/>
  <rect x="426" y="3" width="16" height="1" fill="#FFFFFF"/>
  <rect x="426" y="3" width="1" height="14" fill="#FFFFFF"/>
  <rect x="426" y="16" width="16" height="1" fill="#404040"/>
  <rect x="441" y="3" width="1" height="14" fill="#404040"/>
  <rect x="430" y="12" width="6" height="2" fill="#000000"/>
  <rect x="444" y="3" width="16" height="14" fill="#C0C0C0"/>
  <rect x="444" y="3" width="16" height="1" fill="#FFFFFF"/>
  <rect x="444" y="3" width="1" height="14" fill="#FFFFFF"/>
  <rect x="444" y="16" width="16" height="1" fill="#404040"/>
  <rect x="459" y="3" width="1" height="14" fill="#404040"/>
  <rect x="449" y="7" width="7" height="6" fill="none" stroke="#000000" stroke-width="1"/>
  <rect x="449" y="7" width="7" height="2" fill="#000000"/>
  <rect x="462" y="3" width="16" height="14" fill="#C0C0C0"/>
  <rect x="462" y="3" width="16" height="1" fill="#FFFFFF"/>
  <rect x="462" y="3" width="1" height="14" fill="#FFFFFF"/>
  <rect x="462" y="16" width="16" height="1" fill="#404040"/>
  <rect x="477" y="3" width="1" height="14" fill="#404040"/>
  <path d="M466.5,6.5 L473.5,13.5 M473.5,6.5 L466.5,13.5" stroke="#000000" stroke-width="2"/>

  <!-- menu bar -->
  <rect x="1" y="19" width="478" height="17" fill="#C0C0C0"/>
  <text x="6" y="31" font-family="MS Sans Serif,Verdana,sans-serif" font-size="11" fill="#000000">File   Edit   Search   Insert   Format   View   Help</text>
  <rect x="1" y="36" width="478" height="1" fill="#808080"/>

  <!-- document body (sunken) -->
  <rect x="4" y="39" width="472" height="427" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
  <rect x="4" y="39" width="472" height="427" fill="none" stroke="#FFFFFF" stroke-width="1" transform="translate(1,1)"/>

  <!-- config text -->
  <g font-family="'Courier New',Courier,monospace" font-size="12" fill="#000000" xml:space="preserve">
  <text x="14" y="57">[me]</text>
  <text x="14" y="73">name   = Henry Arcangelo</text>
  <text x="14" y="89">handle = arcxlo</text>
  <text x="14" y="105">role   = Developer</text>
  <text x="14" y="121">degree = Computer Engineering (studying)</text>
  <text x="14" y="137">age    = √( 5! / 4! )⁴</text>
  <text x="14" y="169">[stack]</text>
  <text x="14" y="185">os       = Arch 𖤂 (btw)</text>
  <text x="14" y="201">editor   = Fresh / Nano</text>
  <text x="14" y="217">langs    = TypeScript · Python · Lua · PHP · C++ (Studying)</text>
  <text x="14" y="233">frontend = React.js + Native · Next.js · Vue.js · TailwindCSS</text>
  <text x="14" y="249">backend  = Node.js · Django · Flask · Laravel · Express</text>
  <text x="14" y="265">infra    = Docker · Nginx · MS Server · Apache</text>
  <text x="14" y="281">cloud    = Cloudflare, AWS, Azure, DigitalOcean, Vercel</text>
  <text x="14" y="297">ci-cd    = GitHub Actions · GitLab CI · Jenkins</text>
  <text x="14" y="313">db       = PostgreSQL · MongoDB · SQLite · Firebase · MySQL</text>
  <text x="14" y="345">[field]</text>
  <text x="14" y="361">main   = Software Development · Backend · DevOps</text>
  <text x="14" y="377">goal   = Cybersecurity · Network Engineering</text>
  <text x="14" y="409">[locale]</text>
  <text x="14" y="425">langs   = pt-PT, en-UK, es-ES</text>
  <text x="14" y="441">charset = UTF-8</text>
  </g>
</svg>
