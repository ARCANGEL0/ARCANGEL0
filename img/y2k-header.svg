<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="ARCANGELO homepage in a Netscape Navigator window, Win95 style">
  <defs>
    <pattern id="vpstars" width="47" height="37" patternUnits="userSpaceOnUse">
      <rect x="5" y="8" width="1" height="1" fill="#FFFFFF" opacity=".9"/>
      <rect x="27" y="24" width="1" height="1" fill="#FFFF00" opacity=".7"/>
      <rect x="39" y="4" width="1" height="1" fill="#00FF00" opacity=".6"/>
      <rect x="15" y="31" width="1" height="1" fill="#FF00FF" opacity=".6"/>
      <rect x="44" y="18" width="1" height="1" fill="#00FFFF" opacity=".7"/>
      <rect x="33" y="12" width="1" height="1" fill="#FFFFFF" opacity=".5"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="-47 37" dur="13s" repeatCount="indefinite"/>
    </pattern>

    <linearGradient id="tgold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#FFF9B0"/>
      <stop offset="1" stop-color="#FFD400"/>
    </linearGradient>

    <filter id="sglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="tglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- window frame -->
  <rect width="900" height="250" fill="#C0C0C0"/>
  <rect width="900" height="1" fill="#FFFFFF"/>
  <rect width="1" height="250" fill="#FFFFFF"/>
  <rect y="249" width="900" height="1" fill="#404040"/>
  <rect x="899" width="1" height="250" fill="#404040"/>

  <!-- titlebar -->
  <rect x="1" y="1" width="898" height="18" fill="#000080"/>
  <text x="5" y="13" font-family="MS Sans Serif,Verdana,sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF">ARCANGELO's Home Page - Netscape</text>
  <rect x="846" y="3" width="16" height="14" fill="#C0C0C0"/>
  <rect x="846" y="3" width="16" height="1" fill="#FFFFFF"/>
  <rect x="846" y="3" width="1" height="14" fill="#FFFFFF"/>
  <rect x="846" y="16" width="16" height="1" fill="#404040"/>
  <rect x="861" y="3" width="1" height="14" fill="#404040"/>
  <rect x="850" y="12" width="6" height="2" fill="#000000"/>
  <rect x="864" y="3" width="16" height="14" fill="#C0C0C0"/>
  <rect x="864" y="3" width="16" height="1" fill="#FFFFFF"/>
  <rect x="864" y="3" width="1" height="14" fill="#FFFFFF"/>
  <rect x="864" y="16" width="16" height="1" fill="#404040"/>
  <rect x="879" y="3" width="1" height="14" fill="#404040"/>
  <rect x="869" y="7" width="7" height="6" fill="none" stroke="#000000" stroke-width="1"/>
  <rect x="869" y="7" width="7" height="2" fill="#000000"/>
  <rect x="882" y="3" width="16" height="14" fill="#C0C0C0"/>
  <rect x="882" y="3" width="16" height="1" fill="#FFFFFF"/>
  <rect x="882" y="3" width="1" height="14" fill="#FFFFFF"/>
  <rect x="882" y="16" width="16" height="1" fill="#404040"/>
  <rect x="897" y="3" width="1" height="14" fill="#404040"/>
  <path d="M886.5,6.5 L893.5,13.5 M893.5,6.5 L886.5,13.5" stroke="#000000" stroke-width="2"/>

  <!-- menu bar -->
  <text x="6" y="31" xml:space="preserve" font-family="MS Sans Serif,Verdana,sans-serif" font-size="11" fill="#000000">File    Edit    View    Go    Bookmarks    Options    Directory    Help</text>
  <rect x="1" y="35" width="898" height="1" fill="#808080"/>

  <!-- toolbar + location -->
  <rect x="12" y="38" width="44" height="16" fill="#C0C0C0"/>
  <rect x="12" y="38" width="44" height="1" fill="#FFFFFF"/>
  <rect x="12" y="38" width="1" height="16" fill="#FFFFFF"/>
  <rect x="12" y="53" width="44" height="1" fill="#404040"/>
  <rect x="55" y="38" width="1" height="16" fill="#404040"/>
  <text x="34" y="50" text-anchor="middle" font-family="MS Sans Serif,Verdana,sans-serif" font-size="10" fill="#000000">Back</text>
  <rect x="74" y="38" width="52" height="16" fill="#C0C0C0"/>
  <rect x="74" y="38" width="52" height="1" fill="#FFFFFF"/>
  <rect x="74" y="38" width="1" height="16" fill="#FFFFFF"/>
  <rect x="74" y="53" width="52" height="1" fill="#404040"/>
  <rect x="125" y="38" width="1" height="16" fill="#404040"/>
  <text x="100" y="50" text-anchor="middle" font-family="MS Sans Serif,Verdana,sans-serif" font-size="10" fill="#000000">Forward</text>
  <rect x="144" y="38" width="44" height="16" fill="#C0C0C0"/>
  <rect x="144" y="38" width="44" height="1" fill="#FFFFFF"/>
  <rect x="144" y="38" width="1" height="16" fill="#FFFFFF"/>
  <rect x="144" y="53" width="44" height="1" fill="#404040"/>
  <rect x="187" y="38" width="1" height="16" fill="#404040"/>
  <text x="166" y="50" text-anchor="middle" font-family="MS Sans Serif,Verdana,sans-serif" font-size="10" fill="#000000">Home</text>
  <rect x="206" y="38" width="52" height="16" fill="#C0C0C0"/>
  <rect x="206" y="38" width="52" height="1" fill="#FFFFFF"/>
  <rect x="206" y="38" width="1" height="16" fill="#FFFFFF"/>
  <rect x="206" y="53" width="52" height="1" fill="#404040"/>
  <rect x="257" y="38" width="1" height="16" fill="#404040"/>
  <text x="232" y="50" text-anchor="middle" font-family="MS Sans Serif,Verdana,sans-serif" font-size="10" fill="#000000">Reload</text>
  <text x="276" y="50" font-family="MS Sans Serif,Verdana,sans-serif" font-size="10" fill="#000000">Location:</text>
  <rect x="330" y="38" width="558" height="16" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
  <text x="336" y="50" font-family="'Courier New',Courier,monospace" font-size="11" fill="#000000">www.github.com/ARCANGEL0</text>
  <rect x="1" y="56" width="898" height="1" fill="#808080"/>

  <!-- viewport: the homepage -->
  <rect x="4" y="57" width="892" height="176" fill="#000033"/>
  <rect x="4" y="57" width="892" height="176" fill="url(#vpstars)"/>
  <rect x="4" y="57" width="892" height="176" fill="none" stroke="#808080" stroke-width="1"/>

  <!-- page title: black outline layer + gold fill layer -->
  <g font-family="'Times New Roman',Times,serif" font-weight="bold"
     font-size="90" letter-spacing="3">
    <text x="450" y="152" text-anchor="middle" stroke="#000000" stroke-width="10" stroke-linejoin="round" fill="#000000">ARCANGELO</text>
    <text x="450" y="152" text-anchor="middle" fill="url(#tgold)" filter="url(#tglow)">ARCANGELO</text>
  </g>

  <!-- tagline -->
  <text x="450" y="190" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-weight="bold"
        font-size="15" fill="#00FF00" filter="url(#sglow)">★ fullstack · devops · security ★
    <animate attributeName="fill" values="#00FF00;#FFFF00;#00FFFF;#FF00FF" calcMode="discrete" dur="2s" repeatCount="indefinite"/>
  </text>

  <!-- blinking NEW! starburst -->
  <g transform="translate(806,86) rotate(-12)" filter="url(#sglow)">
    <polygon points="0.0,-26.0 4.2,-10.2 18.4,-18.4 10.2,-4.2 26.0,0.0 10.2,4.2 18.4,18.4 4.2,10.2 0.0,26.0 -4.2,10.2 -18.4,18.4 -10.2,4.2 -26.0,0.0 -10.2,-4.2 -18.4,-18.4 -4.2,-10.2" fill="#FFFF00" stroke="#FF0000" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle"
          font-family="Impact,'Arial Black',Arial,sans-serif"
          font-size="13" fill="#FF0000">NEW!</text>
    <animate attributeName="opacity" values="1;0" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/>
  </g>

  <!-- blinking sparkles -->
  <g filter="url(#sglow)" fill="none">
    <g stroke="#FFFFFF" stroke-width="1.2">
      <path d="M62 88V100 M56 94H68 M58 90L66 98 M66 90L58 98"/>
      <animate attributeName="opacity" values="0;1;0" calcMode="discrete" dur="1.3s" repeatCount="indefinite"/>
    </g>
    <g stroke="#FFFF00" stroke-width="1">
      <path d="M175 205V213 M171 209H179 M172 206L178 212 M178 206L172 212"/>
      <animate attributeName="opacity" values="0;1;0" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/>
    </g>
    <g stroke="#FF00FF" stroke-width="1">
      <path d="M140 205V212 M136.5 208.5H143.5"/>
      <animate attributeName="opacity" values="1;0;1" calcMode="discrete" dur="1.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- status bar -->
  <rect x="1" y="233" width="898" height="16" fill="#C0C0C0"/>
  <rect x="1" y="233" width="898" height="1" fill="#FFFFFF"/>
  <text x="10" y="245" font-family="MS Sans Serif,Verdana,sans-serif" font-size="10" fill="#000000">Document: Done</text>
</svg>
